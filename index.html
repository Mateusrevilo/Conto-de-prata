<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conto de Pratas | Joias em prata 925</title>
  <meta name="description" content="Conto de Pratas - joias em prata 925. Veja o catálogo e peça pelo WhatsApp." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Conto de Pratas | Joias em prata 925" />
  <meta property="og:description" content="Escolha seus produtos e finalize o pedido pelo WhatsApp." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="announce" id="announce" hidden></div>
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="brand" id="brand">
        <img id="brandLogo" class="brand__logo" alt="" hidden />
        <span id="brandName" class="brand__name"></span>
      </a>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Buscar produtos..." aria-label="Buscar produtos" />
      </div>
      <a class="ig-btn" id="igHeader" target="_blank" rel="noopener" aria-label="Instagram" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ig-icon"/></svg>
      </a>
      <button class="cart-btn" id="openCart" aria-label="Abrir carrinho">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.5" fill="currentColor"/><circle cx="18" cy="20" r="1.5" fill="currentColor"/></svg>
        <span class="cart-btn__count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero" id="hero" aria-label="Destaques">
      <div class="hero__track" id="heroTrack"></div>
      <div class="hero__dots" id="heroDots"></div>
    </section>

    <section class="container" id="produtos">
      <nav class="chips" id="categories" aria-label="Categorias"></nav>
      <div class="toolbar">
        <span id="resultCount" class="muted"></span>
        <select id="sort" aria-label="Ordenar">
          <option value="relevancia">Relevância</option>
          <option value="menor">Menor preço</option>
          <option value="maior">Maior preço</option>
          <option value="az">A-Z</option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>Nenhum produto encontrado.</p>
    </section>
    <section class="insta" id="instagram" hidden>
      <div class="container">
        <div class="insta__head">
          <div class="insta__avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ig-icon"/></svg></div>
          <div class="insta__text">
            <h2>Siga a gente no Instagram</h2>
            <p><strong id="igHandle"></strong> · lançamentos, novidades e promoções em primeira mão</p>
          </div>
          <a class="btn btn--insta" id="igFollow" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ig-icon"/></svg>
            Seguir no Instagram
          </a>
        </div>
        <div class="insta__grid" id="igGrid"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div>
        <strong id="footerName"></strong>
        <p class="muted" id="footerSlogan"></p>
      </div>
      <div class="footer__info" id="footerInfo"></div>
    </div>
  </footer>

  <!-- Modal de produto -->
  <div class="overlay" id="productOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pmName">
      <button class="icon-btn modal__close" data-close aria-label="Fechar">&times;</button>
      <div class="modal__img">
        <div class="gallery" id="pmGallery"></div>
        <button type="button" class="gallery__nav gallery__nav--prev" id="pmPrev" aria-label="Foto anterior" hidden>&#8249;</button>
        <button type="button" class="gallery__nav gallery__nav--next" id="pmNext" aria-label="Próxima foto" hidden>&#8250;</button>
        <div class="gallery__dots" id="pmDots"></div>
      </div>
      <div class="modal__body">
        <span class="tag" id="pmCat"></span>
        <h2 id="pmName"></h2>
        <div class="price" id="pmPrice"></div>
        <p class="muted" id="pmDesc"></p>
        <div id="pmVariations"></div>
        <label class="field">
          <span>Observação (opcional)</span>
          <input id="pmNote" type="text" placeholder="Ex.: embalar para presente" />
        </label>
        <div class="modal__actions">
          <div class="qty">
            <button type="button" data-qty="-1" aria-label="Diminuir">−</button>
            <span id="pmQty">1</span>
            <button type="button" data-qty="1" aria-label="Aumentar">+</button>
          </div>
          <button class="btn btn--primary" id="pmAdd">Adicionar ao carrinho</button>
        </div>
        <button class="btn btn--whats btn--block" id="pmBuyNow">
          <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#wa-icon"/></svg>
          Pedir só este pelo WhatsApp
        </button>
        <p class="error" id="pmError" hidden></p>
      </div>
    </div>
  </div>

  <!-- Carrinho -->
  <div class="overlay overlay--drawer" id="cartOverlay" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
      <div class="drawer__head">
        <h2 id="cartTitle">Seu pedido</h2>
        <button class="icon-btn" data-close aria-label="Fechar">&times;</button>
      </div>
      <div class="drawer__body">
        <ul class="cart-list" id="cartList"></ul>
        <p class="empty" id="cartEmpty">Seu carrinho está vazio.</p>

        <form id="checkoutForm" class="checkout" novalidate>
          <h3>Dados para o pedido</h3>
          <label class="field">
            <span>Seu nome *</span>
            <input name="nome" required autocomplete="name" />
          </label>
          <fieldset class="field" id="deliveryField">
            <span>Recebimento *</span>
            <div class="radios" id="deliveryOptions"></div>
          </fieldset>
          <label class="field" id="addressField" hidden>
            <span>Endereço de entrega *</span>
            <textarea name="endereco" rows="2" autocomplete="street-address" placeholder="Rua, número, bairro, complemento"></textarea>
          </label>
          <label class="field">
            <span>Forma de pagamento *</span>
            <select name="pagamento" id="paymentSelect" required></select>
          </label>
          <label class="field" id="changeField" hidden>
            <span>Troco para quanto?</span>
            <input name="troco" inputmode="decimal" placeholder="Ex.: 100" />
          </label>
          <label class="field">
            <span>Observações</span>
            <textarea name="obs" rows="2"></textarea>
          </label>
        </form>
      </div>
      <div class="drawer__foot" id="cartFoot">
        <div class="summary">
          <div><span>Subtotal</span><span id="sumSubtotal"></span></div>
          <div id="sumDeliveryRow"><span>Entrega</span><span id="sumDelivery"></span></div>
          <div class="summary__total"><span>Total</span><span id="sumTotal"></span></div>
        </div>
        <p class="error" id="cartError" hidden></p>
        <button class="btn btn--whats btn--block" id="sendOrder">
          <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#wa-icon"/></svg>
          Enviar pedido pelo WhatsApp
        </button>
      </div>
    </aside>
  </div>

  <a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#wa-icon"/></svg>
  </a>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ig-icon" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/>
    </symbol>
    <symbol id="wa-icon" viewBox="0 0 32 32">
      <path fill="currentColor" d="M16.04 3C9.4 3 4 8.36 4 14.96c0 2.1.56 4.16 1.62 5.97L4 27l6.24-1.6a12.1 12.1 0 0 0 5.8 1.47h.01c6.63 0 12.03-5.36 12.03-11.96C28.08 8.36 22.68 3 16.04 3zm0 21.86h-.01c-1.8 0-3.56-.48-5.1-1.39l-.37-.22-3.7.95.99-3.6-.24-.37a9.9 9.9 0 0 1-1.53-5.27c0-5.48 4.49-9.94 10-9.94 2.67 0 5.18 1.04 7.07 2.92a9.84 9.84 0 0 1 2.92 7.03c0 5.48-4.49 9.9-10.03 9.9zm5.49-7.43c-.3-.15-1.78-.87-2.05-.97-.28-.1-.48-.15-.68.15-.2.3-.78.97-.96 1.17-.18.2-.35.22-.65.07-.3-.15-1.27-.46-2.42-1.48-.9-.8-1.5-1.78-1.67-2.08-.18-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.68-1.63-.93-2.23-.24-.58-.49-.5-.68-.51h-.58c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.22 3.08.15.2 2.1 3.2 5.08 4.48.71.3 1.27.49 1.7.63.72.23 1.37.2 1.88.12.57-.09 1.78-.72 2.03-1.42.25-.7.25-1.3.18-1.42-.08-.13-.28-.2-.58-.35z"/>
    </symbol>
  </svg>

  <script src="js/app.js"></script>
</body>
</html>
